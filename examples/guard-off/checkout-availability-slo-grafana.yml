            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[3d])) or 0 * sum(rate(http_requests_total{job="checkout"}[3d]))) / sum(rate(http_requests_total{job="checkout"}[3d]))'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
