            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: C
              expr: 'sum(rate(http_request_duration_seconds_count{job="checkout"}[3d]))'
              instant: true
              range: false
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: D
              type: math
              expression: '$A > 0.001 && $B > 0.001 && $C > 1'
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: 'ticket'
          slo: 'checkout-latency'
          long_window: '3d'
          short_window: '6h'
        annotations:
          summary: 'checkout latency SLO is burning its error budget at 1x (10% of the 30d budget in 3d)'
          description: 'Error ratio over the last 3d is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}unknown (no data){{ end }}. Alert threshold is 0.1% errors (1x burn on a 99.9% SLO, 3d and 6h windows). At this rate the 30d budget lasts 30d.'
          runbook_url: 'https://example.com/REPLACE-ME/runbooks/slo-checkout-latency'
