# Grafana alerting file provisioning for the checkout SLO: 99.9% over 30d (latency).
# Multiwindow, multi-burn-rate alerts (Google SRE Workbook, chapter 5).
# Edit: https://slo.coreyjones.dev/#sli=latency
# Goes in provisioning/alerting/. Replace PROMETHEUS_DATASOURCE_UID with your Prometheus datasource UID.
# runbook_url values are placeholders.
apiVersion: 1
groups:
  - orgId: 1
    name: 'slo-checkout-latency'
    folder: SLOs
    interval: 1m
    rules:
      - uid: 'slo-checkout-latency-1h-5m'
        title: 'checkout latency SLO burn 1h/5m'
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[1h])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[1h])))'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: B
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[5m])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[5m])))'
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: C
              expr: 'sum(rate(http_request_duration_seconds_count{job="checkout"}[1h]))'
              instant: true
              range: false
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: D
              type: math
              expression: '$A > 0.0144 && $B > 0.0144 && $C > 1'
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: 'page'
          slo: 'checkout-latency'
          long_window: '1h'
          short_window: '5m'
        annotations:
          summary: 'checkout latency SLO is burning its error budget at 14.4x (2% of the 30d budget in 1h)'
          description: 'Error ratio over the last 1h is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}unknown (no data){{ end }}. Alert threshold is 1.44% errors (14.4x burn on a 99.9% SLO, 1h and 5m windows). At this rate the 30d budget lasts 2d 2h.'
          runbook_url: 'https://example.com/REPLACE-ME/runbooks/slo-checkout-latency'
      - uid: 'slo-checkout-latency-6h-30m'
        title: 'checkout latency SLO burn 6h/30m'
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[6h])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[6h])))'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: B
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[30m])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[30m])))'
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: C
              expr: 'sum(rate(http_request_duration_seconds_count{job="checkout"}[6h]))'
              instant: true
              range: false
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: D
              type: math
              expression: '$A > 0.006 && $B > 0.006 && $C > 1'
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: 'page'
          slo: 'checkout-latency'
          long_window: '6h'
          short_window: '30m'
        annotations:
          summary: 'checkout latency SLO is burning its error budget at 6x (5% of the 30d budget in 6h)'
          description: 'Error ratio over the last 6h is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}unknown (no data){{ end }}. Alert threshold is 0.6% errors (6x burn on a 99.9% SLO, 6h and 30m windows). At this rate the 30d budget lasts 5d.'
          runbook_url: 'https://example.com/REPLACE-ME/runbooks/slo-checkout-latency'
      - uid: 'slo-checkout-latency-1d-2h'
        title: 'checkout latency SLO burn 1d/2h'
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[1d])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[1d])))'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: B
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[2h])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[2h])))'
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: C
              expr: 'sum(rate(http_request_duration_seconds_count{job="checkout"}[1d]))'
              instant: true
              range: false
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: D
              type: math
              expression: '$A > 0.003 && $B > 0.003 && $C > 1'
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: 'ticket'
          slo: 'checkout-latency'
          long_window: '1d'
          short_window: '2h'
        annotations:
          summary: 'checkout latency SLO is burning its error budget at 3x (10% of the 30d budget in 1d)'
          description: 'Error ratio over the last 1d is {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}unknown (no data){{ end }}. Alert threshold is 0.3% errors (3x burn on a 99.9% SLO, 1d and 2h windows). At this rate the 30d budget lasts 10d.'
          runbook_url: 'https://example.com/REPLACE-ME/runbooks/slo-checkout-latency'
      - uid: 'slo-checkout-latency-3d-6h'
        title: 'checkout latency SLO burn 3d/6h'
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[3d])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[3d])))'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: B
              expr: '1 - (sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[6h])) / sum(rate(http_request_duration_seconds_count{job="checkout"}[6h])))'
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 600
