<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · SLO burn-rate calculator</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f6f8;--fg:#17202b;--muted:#536070;--line:#d9dee5;--bad:#b8322a;--accent:#9a5700}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e4eaf1;--muted:#93a0b0;--line:#26313f;--bad:#f0675d;--accent:#f0a83a;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.55 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{max-width:520px;display:grid;gap:14px}
.k{font:600 13px ui-monospace,Menlo,monospace;color:var(--bad);letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font:700 40px/1.05 "IBM Plex Sans Condensed","Arial Narrow",sans-serif}
p{margin:0;color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<span class="k">404 · Not found</span>
<h1>This page is outside the SLO window.</h1>
<p>Nothing lives at this address. It does not count against your error budget.</p>
<p><a href="/">Back to the burn-rate calculator</a></p>
</main>
</body>
</html>
